name: Publish KasirIn

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          tar -xJf .release/kasirin-source.tar.xz -C app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npx vite build

      - name: Publish gh-pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kasirin-site
          cp -a app/dist/. /tmp/kasirin-site/
          touch /tmp/kasirin-site/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -rf . || true
          cp -a /tmp/kasirin-site/. .
          git add -A
          git commit -m "deploy: KasirIn GitHub Pages"
          git push --force origin gh-pages
