name: Publish clean KasirIn source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean source
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/part*.b64 | base64 --decode > /tmp/kasirin.tar.xz
          tar -xJf /tmp/kasirin.tar.xz -C .
          rm -rf .publish .bootstrap .bootstrap2
          rm -f .github/workflows/bootstrap-deploy.yml .github/workflows/bootstrap-deploy-v2.yml .github/workflows/publish-clean-source.yml

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish KasirIn source"
          git push origin main
