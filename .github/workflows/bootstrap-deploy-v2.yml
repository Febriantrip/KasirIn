name: Bootstrap and deploy KasirIn v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project source
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/kasirin-*.b64 /tmp/kasirin-*.tar.xz

          cat .bootstrap2/part00.b64 .bootstrap2/part01.b64 .bootstrap2/part02.b64 .bootstrap2/part03.b64 .bootstrap2/part04.b64 .bootstrap2/part05.b64 .bootstrap2/part06.b64 > /tmp/prefix.b64

          cat /tmp/prefix.b64 .bootstrap2/part07.b64 .bootstrap2/part08.b64 > /tmp/kasirin-a.b64
          { cat /tmp/prefix.b64; head -c 20000 .bootstrap2/part07.b64; cat .bootstrap2/part08.b64; } > /tmp/kasirin-b.b64
          { cat /tmp/prefix.b64; tail -c 20000 .bootstrap2/part07.b64; cat .bootstrap2/part08.b64; } > /tmp/kasirin-c.b64
          cat /tmp/prefix.b64 .bootstrap2/part07.b64 > /tmp/kasirin-d.b64
          { cat /tmp/prefix.b64; head -c 20000 .bootstrap2/part07.b64; } > /tmp/kasirin-e.b64
          { cat /tmp/prefix.b64; tail -c 20000 .bootstrap2/part07.b64; } > /tmp/kasirin-f.b64

          found=''
          for variant in a b c d e f; do
            if base64 --decode "/tmp/kasirin-${variant}.b64" > "/tmp/kasirin-${variant}.tar.xz" 2>/dev/null && xz -t "/tmp/kasirin-${variant}.tar.xz" 2>/dev/null; then
              found="$variant"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo 'No bootstrap archive variant passed xz validation.'
            exit 1
          fi

          echo "Recovered archive variant: $found"
          tar -xJf "/tmp/kasirin-${found}.tar.xz" -C .
          rm -rf .bootstrap .bootstrap2
          rm -f .github/workflows/bootstrap-deploy.yml .github/workflows/bootstrap-deploy-v2.yml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          if p.exists():
              s = p.read_text()
              if "base: '/KasirIn/'" not in s:
                  s = s.replace('export default defineConfig({', "export default defineConfig({\n  base: '/KasirIn/',")
                  p.write_text(s)
          for filename in ('package.json', 'package-lock.json'):
              p = Path(filename)
              if p.exists():
                  p.write_text(p.read_text().replace('"name": "aurora-pos-backoffice"', '"name": "kasirin-pos-backoffice"'))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish KasirIn source"
          git push origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/site
          cp -a dist/. /tmp/site/
          touch /tmp/site/.nojekyll
          git switch --orphan gh-pages
          git rm -rf . || true
          cp -a /tmp/site/. .
          git add -A
          git commit -m "deploy: KasirIn GitHub Pages"
          git push --force origin gh-pages
